# Interactive agent: Claude answers when you talk to it on an issue or PR.
#   - comment "@claude ..." on an issue, PR, or review
#   - or add the `claude` label to an issue to hand it over
# Claude reads CLAUDE.md, then the whole issue thread, then acts according to the issue's stage-* label.
# Only users with write access can trigger it (the action checks this), so comments from the public are ignored.
#
# NOTE: issue and comment events always run the copy of this file on the DEFAULT branch (main).
# It has no effect until it has been merged into main.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled, assigned]

# One run per issue/PR at a time; a second @claude waits for the first instead of colliding with it.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Filter here so unrelated issue activity doesn't spin up a runner, and only the repo owner
    # can start a run (the action also rejects users without write access, but this check means a
    # stranger's "@claude" never even starts a runner). Edited comments are deliberately ignored —
    # to re-ask, post a new comment.
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.author_association == 'OWNER' &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.sender.login == github.repository_owner &&
        github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' &&
        github.event.action != 'labeled' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # push work branches
      pull-requests: write   # open/update PRs
      issues: write          # comment and label
      id-token: write        # the action's GitHub App auth
      actions: read          # read CI results
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # history, so Claude can diff against next and read the log

      # Lets Claude do a quick compile check before pushing. The full test suite is left to CI (ci.yml),
      # which costs no tokens.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription token from `claude setup-token` (uses your Pro/Max plan's limits).
          # To bill per token instead: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          base_branch: next          # main stays untouched: it's the résumé link
          branch_prefix: claude/
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Task,Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git fetch:*),Bash(git merge:*),Bash(git branch:*),Bash(git mv:*),Bash(git rm:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh run list:*),Bash(gh run view:*)"
