name: Build and Publish Tool_Box Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Needed to cross-build for arm64 on this (amd64) runner — without this,
      # build-push-action silently only builds for the runner's own platform,
      # which is how the image ended up amd64-only on the first publish.
      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR (and every OCI registry) rejects uppercase in image references —
      # github.repository preserves this repo's actual case ("Timothy-Lee-Grant/Tool_Box"),
      # so it must be lowercased before it can be used as an image name.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 (GitHub-hosted runners, most cloud hosts) + linux/arm64
          # (Apple Silicon dev machines, AWS Graviton, etc.) — build-push-action
          # publishes ONE manifest list covering both; `docker pull`/`compose up`
          # on either architecture resolves the same tag to the right image.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}