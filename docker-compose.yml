# Tool_Box standalone dev compose (plan 002, Step 4).
# This whole file IS the dev environment, so the port publication lives here
# openly. The production posture (ADR-008) applies to CONSUMING composes like
# LLM_Monitor's: there, the toolbox service gets NO ports section at all —
# reachable only on the internal network, and "lockdown is a config change".
services:
  toolbox:
    build: .
    container_name: toolbox
    ports:
      - "8081:8080" # host:container — Inspector connects to http://localhost:8081/mcp
      - "8090:8090" # host:container — voxel viewer WebSocket; viewer/index.html connects to ws://localhost:8090/voxel/
    environment:
      # Bind addresses stated explicitly (ADR-016): inside a container "loopback" is
      # unreachable from the published ports, so both listeners opt in to all interfaces.
      TOOLBOX_Ports__Mcp__Address: "0.0.0.0"
      TOOLBOX_Ports__Viewer__Address: "0.0.0.0"
      # DNS-rebinding defense (ADR-021): McpGuardMiddleware answers 421 for any Host that is not
      # loopback (always allowed, any port, so localhost:8081 works) or listed here. The service
      # name is what other containers (LLM_Monitor) send. Deliberately NOT the bare AllowedHosts:
      # ASP.NET's HostFiltering would answer 400 before our guard could answer 421.
      TOOLBOX_Security__Mcp__AllowedHosts__0: "toolbox"
    healthcheck:
      # curl exists because the Dockerfile installs it — the aspnet base image
      # ships without it (LLM_Monitor's slim-image lesson, .NET edition).
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
